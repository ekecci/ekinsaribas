<body><script>(()=>{const SITE={"about": "I'm Ekin, an architectural designer with an MSc in Architecture from TU Delft. Across my studies I developed a sequence-led approach to design: reading how people move, pause and gather, and shaping spaces that unfold from the street to the most intimate room. From reconnecting the bazaar of Homs and stitching a cultural route through Brussels to growing a neighbourhood in Buenos Aires step by step and turning an Arnhem block from busy edge to calm courtyard, each project starts from what a place already has. Alongside architecture, I integrate AI systems into the design process and curate jewellery.", "email": "", "linkedin": "", "portfolio": "https://behance.net/ekinsaribas", "name": "Ekin Saribas", "role": "Junior Architectural Designer | MSc Architecture, TU Delft"},PROJ=[{"id": "homs", "order": 1, "title": "Reconnecting Homs", "tagline": "The city is damaged. The system is still there.", "summary": "Rather than rebuilding Homs Old Town as a collection of isolated objects, this project begins with the network that still connects it: the bazaar. I mapped surviving routes, workshops, courtyards and patterns of trade to find where a targeted intervention could restore continuity.\n\nAt the end of the bazaar, a ruined khan becomes a cultural centre with workshops, a library, auditorium, restaurant and public courtyard. Historic masonry defines the spatial sequence, while a new independent structure carries the programme.", "kind": "Public Building | Cultural Center – Reconstruction", "place": "Homs, Syria", "year": "2025–2026", "context": "TU Delft, UN-Habitat, Humane Urbanism", "tutors": "Job Schroën, Alessandra Navarro, Tosin Oshinowo", "team": "", "software": "", "cover": "img/homs_hero.jpg", "spreads": [{"src": "img/homs_1.jpg", "tab": "Introduction", "caption": ""}, {"src": "img/homs_2.jpg", "tab": "Technique", "caption": "Reading damage as a broken network"}, {"src": "img/homs_3.jpg", "tab": "Floor Plan", "caption": ""}, {"src": "img/homs_4.jpg", "tab": "Zoom In", "caption": ""}]}, {"id": "bond", "order": 2, "title": "The Bond", "tagline": "Stitching Brussels back together", "summary": "A cultural hub between the EU Quarter and its surrounding neighbourhood. The neighbourhood comes before the masterplan: separate plots become one shared ground, with a route that leads from the metro entrance through terraces to a courtyard, marking where people pass through and where they stop.", "kind": "Public Building | Cultural Hub", "place": "Brussels, Belgium", "year": "2024–25", "context": "TU Delft", "tutors": "", "team": "", "software": "", "cover": "img/bond_hero.jpg", "spreads": [{"src": "img/bond_1.jpg", "tab": "Introduction", "caption": ""}, {"src": "img/bond_2.jpg", "tab": "Technique", "caption": "The neighbourhood comes before the masterplan"}, {"src": "img/bond_3.jpg", "tab": "Floor Plan", "caption": ""}, {"src": "img/bond_4.jpg", "tab": "Zoom In", "caption": ""}]}, {"id": "tigre", "order": 3, "title": "Tigre Games", "tagline": "How do you add homes without taking away a neighbourhood?", "summary": "A fieldwork-based academic proposal for El Garrote, Buenos Aires. The plan becomes the game: residents combine housing modules and cards to grow the neighbourhood step by step, adding homes, shared space and services without displacing the people who live there.", "kind": "Residential | Slum Redevelopment", "place": "Buenos Aires, Argentina", "year": "2025", "context": "TU Delft", "tutors": "", "team": "", "software": "", "cover": "img/tigre_hero.jpg", "spreads": [{"src": "img/tigre_1.jpg", "tab": "Introduction", "caption": ""}, {"src": "img/tigre_2.jpg", "tab": "Technique", "caption": "The plan becomes the game"}, {"src": "img/tigre_3.jpg", "tab": "Floor Plan", "caption": ""}, {"src": "img/tigre_4.jpg", "tab": "Zoom In", "caption": ""}]}, {"id": "sequence", "order": 4, "title": "The Sequence", "tagline": "City chaos, but make it healing", "summary": "An urban block in Arnhem built on a mapping of movement and noise. The design moves from the active Rozet edge, through a planted courtyard, to quieter housing and treatment spaces.", "kind": "Residential-Commercial | Urban Block Design", "place": "Arnhem, Netherlands", "year": "2023–24", "context": "TU Delft", "tutors": "", "team": "", "software": "", "cover": "img/sequence_hero.jpg", "spreads": [{"src": "img/sequence_1.jpg", "tab": "Introduction", "caption": ""}, {"src": "img/sequence_2.jpg", "tab": "Technique", "caption": "Mapping the transition from activity to calm"}, {"src": "img/sequence_3.jpg", "tab": "Floor Plan", "caption": ""}, {"src": "img/sequence_4.jpg", "tab": "Zoom In", "caption": ""}]}, {"id": "bau", "order": 5, "title": "BAU Munich", "tagline": "Exhibition stand, professional work", "summary": "Independently designed a complete exhibition stand for BAU Munich 2025, one of the leading international trade fairs for architecture, materials and construction: the visitor sequence and the stand interior, as well as the posters, flyers and banners, within two days and on a tight budget.", "kind": "Professional · Individual", "place": "Munich, Germany", "year": "2025", "context": "Professional work", "tutors": "", "team": "", "software": "", "cover": "img/work_hero.jpg", "spreads": [{"src": "img/work_1.jpg", "tab": "Introduction", "caption": "Exhibition stand design, BAU Munich 2025"}]}, {"id": "abastumani", "order": 6, "title": "Abastumani Hotel", "tagline": "Hotel and spa interiors in a heritage building", "summary": "Contributed to the Abastumani hotel project in Georgia: concepts, moodboards, material palettes and preliminary models, with interior, exterior and contextual design studies. Worked in Revit on the spa and pool design; the interior materiality and moodboard were my individual part within the team.", "kind": "Professional | Hotel & Spa Interiors", "place": "Abastumani, Georgia", "year": "", "context": "Professional work", "tutors": "", "team": "", "software": "Revit", "cover   db.collection('projects').onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(tm);projects=s.docs.map(d=>({id:d.id,...d.data()}));buildBook();if(document.body.classList.contains('detail'))route();if($('#panel').classList.contains('on')&&!pb.querySelector('textarea'))listView()},e=>{clearTimeout(tm);$('#count').textContent='The book couldn’t load ('+e.code+').'});
  try{canEdit=!!(user&&await user.canEdit())}catch{canEdit=false}
  if(canEdit){$('#editBtn').hidden=false;try{assets=await claude.use('assets')}catch{assets=null}}
})();
}
</script>
</body>
